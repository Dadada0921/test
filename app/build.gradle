plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.xunyouhook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.xunyouhook'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (project.hasProperty("KEYSTORE_FILE")) {
                storeFile file(KEYSTORE_FILE)
                storePassword KEYSTORE_PASSWORD
                keyAlias KEY_ALIAS
                keyPassword KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false

            if (project.hasProperty("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
