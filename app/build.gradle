plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.xunyouhook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.xunyouhook'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    // LSPosed/Xposed API 82; compile-time only, not packaged into the APK.
    compileOnly 'de.robv.android.xposed:api:82'
}
